<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>Coo · 设置</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: linear-gradient(180deg, #f7f9ff 0%, #eef3ff 100%);
    color: #232a44;
    font: 13px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", sans-serif;
    -webkit-user-select: none; user-select: none;
    overflow-y: auto;
  }
  .wrap { padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 10px; min-height: 100%; }
  header { display: flex; align-items: center; gap: 10px; }
  header img { width: 40px; height: 40px; border-radius: 12px; background: #fff; box-shadow: 0 4px 12px rgba(61, 91, 240, .16); }
  header .t { flex: 1; min-width: 0; }
  header h1 { margin: 0; font-size: 17px; letter-spacing: .2px; }
  header p { margin: 1px 0 0; font-size: 11.5px; color: #7a84a0; }
  .ver { font-size: 11px; color: #9aa3bd; }
  .card {
    background: #fff; border: 1px solid #dfe7fb; border-radius: 14px;
    padding: 11px 13px 12px; box-shadow: 0 2px 8px rgba(40, 62, 130, .05);
  }
  .card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .card-head h2 { margin: 0; font-size: 12.5px; font-weight: 600; color: #3a4566; flex: 1; letter-spacing: .3px; }
  .link {
    border: 0; background: none; padding: 0; cursor: pointer;
    color: #4d6bfe; font: inherit; font-size: 11.5px;
    -webkit-appearance: none; appearance: none;
  }
  .link:hover { text-decoration: underline; }
  .link:focus { outline: none; }
  .keyrow { display: flex; gap: 6px; }
  input[type=password], input[type=text] {
    flex: 1; min-width: 0; height: 34px; padding: 0 10px;
    border: 1px solid #d5def5; border-radius: 9px; outline: none;
    font: 12.5px ui-monospace, SFMono-Regular, Consolas, monospace; color: #232a44;
    background: #fbfcff; transition: border-color .15s, box-shadow .15s;
    -webkit-user-select: text; user-select: text;
  }
  input:focus { border-color: #8ba4ff; box-shadow: 0 0 0 3px rgba(77, 107, 254, .12); }
  .icon-btn {
    height: 34px; padding: 0 10px; border-radius: 9px; border: 1px solid #d5def5;
    background: #fff; color: #5b6584; font: inherit; font-size: 11.5px; cursor: pointer; white-space: nowrap;
  }
  .icon-btn:hover { border-color: #b8c8f5; color: #3d5bf0; }
  .row { display: flex; gap: 7px; margin-top: 8px; align-items: center; }
  button.primary, button.ghost {
    height: 32px; padding: 0 14px; border-radius: 9px; cursor: pointer; font: inherit; font-size: 12px;
    border: 1px solid transparent; transition: filter .15s, background .15s;
  }
  button.primary { background: linear-gradient(135deg, #4d6bfe, #6f92ff); color: #fff; box-shadow: 0 4px 10px rgba(77, 107, 254, .25); }
  button.primary:hover { filter: brightness(1.05); }
  button.ghost { background: #fff; border-color: #d5def5; color: #4a5474; }
  button.ghost:hover { border-color: #b8c8f5; color: #3d5bf0; }
  button.danger { color: #b84a63; }
  button:disabled { opacity: .55; cursor: default; filter: none; }
  .state { margin-top: 7px; font-size: 11.5px; min-height: 17px; color: #7a84a0; }
  .state.ok { color: #1f9254; }
  .state.err { color: #c2415d; }
  .amount { font-size: 26px; font-weight: 700; color: #3d5bf0; letter-spacing: .3px; line-height: 1.15; margin: 2px 0 2px; }
  .amount .cur { font-size: 12px; font-weight: 500; color: #8a93ad; margin-left: 5px; letter-spacing: 0; }
  .amount.err { font-size: 13px; font-weight: 500; color: #c2415d; }
  .amount.muted { font-size: 14px; font-weight: 500; color: #8a93ad; }
  .breakdown { display: flex; gap: 14px; font-size: 11.5px; color: #6f7892; min-height: 17px; }
  .breakdown b { color: #414b6b; font-weight: 600; }
  .meta { font-size: 11px; color: #9aa3bd; margin-top: 2px; min-height: 15px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .grid label { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: #6f7892; }
  select {
    flex: 1; height: 30px; border: 1px solid #d5def5; border-radius: 8px; background: #fbfcff;
    font: inherit; font-size: 12px; color: #2b3350; padding: 0 6px; outline: none;
  }
  .slider { display: flex; align-items: center; gap: 9px; margin-top: 9px; font-size: 11.5px; color: #6f7892; }
  .slider input[type=range] { flex: 1; accent-color: #4d6bfe; }
  .slider output { width: 42px; text-align: right; color: #3a4566; font-variant-numeric: tabular-nums; }
  .check { display: flex; align-items: center; gap: 7px; margin-top: 7px; font-size: 12px; color: #4a5474; }
  .check input { accent-color: #4d6bfe; }
  footer { margin-top: auto; display: flex; align-items: center; gap: 8px; padding-top: 2px; }
  footer .path { flex: 1; min-width: 0; font-size: 10.5px; color: #a0a9c1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: left; }
  .hint { font-size: 10.5px; color: #9aa3bd; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="../settings-head.png" alt="">
    <div class="t">
      <h1>Coo</h1>
      <p>DeepSeek 余额 · Windows 桌宠</p>
    </div>
    <span class="ver" id="ver"></span>
  </header>

  <section class="card">
    <div class="card-head">
      <h2>API Key</h2>
      <button class="link" id="getKey">打开 DeepSeek 控制台</button>
    </div>
    <div class="keyrow">
      <input id="key" type="password" placeholder="sk-…" spellcheck="false" autocomplete="off">
      <button class="icon-btn" id="eye">显示</button>
    </div>
    <div class="row">
      <button class="primary" id="save">保存并测试</button>
      <button class="ghost" id="test">仅测试</button>
      <button class="ghost danger" id="clear">清除</button>
    </div>
    <div class="state" id="keyState"></div>
  </section>

  <section class="card">
    <div class="card-head">
      <h2>账户余额</h2>
      <button class="link" id="refresh">刷新</button>
    </div>
    <div class="amount muted" id="amount">尚未查询</div>
    <div class="breakdown" id="breakdown"></div>
    <div class="meta" id="meta"></div>
  </section>

  <section class="card">
    <div class="card-head">
      <h2>外观</h2>
      <span class="hint" id="lookHint">改动立即生效</span>
    </div>
    <div class="grid">
      <label>配色 <select id="scheme"></select></label>
      <label>服装 <select id="outfit"></select></label>
    </div>
    <label class="slider">大小 <input id="scale" type="range" min=".6" max="1.6" step=".1"><output id="scaleOut">1.0×</output></label>
    <label class="check"><input id="roam" type="checkbox"> 自由活动（在屏幕上自己走动）</label>
    <label class="check"><input id="autostart" type="checkbox"> 开机自启（打包版生效）</label>
  </section>

  <footer>
    <button class="link" id="folder">数据文件夹</button>
    <span class="path" id="file"></span>
    <button class="primary" id="close">完成</button>
  </footer>
</div>
<script src="./settings.js"></script>
</body>
</html>

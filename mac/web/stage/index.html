<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QoderCoo</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
  body { -webkit-user-select: none; user-select: none; }
  #stage { position: absolute; inset: 0; touch-action: none; }
  #backSvg, #frontSvg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  #backSvg { z-index: 1; }
  #frontSvg { z-index: 3; }
  #whaleLayer { position: absolute; inset: 0; overflow: visible; pointer-events: none; z-index: 2; }
  .shadow { fill: #131b33; opacity: .16; }
  #bubble {
    position: absolute; z-index: 5; width: 240px; box-sizing: border-box; padding: 11px 14px 12px;
    border-radius: 16px; transform: translate(-50%, -100%);
    background: rgba(252, 253, 255, .97);
    color: #1d2340; border: 1px solid rgba(104, 126, 186, .28);
    box-shadow: 0 14px 34px rgba(20, 30, 70, .20), 0 2px 6px rgba(20, 30, 70, .08);
    font: 12.5px/1.45 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    pointer-events: none; opacity: 0; transition: opacity .16s ease;
  }
  #bubble.show { opacity: 1; }
  #bubble::after {
    content: ""; position: absolute; left: 50%; bottom: -6px; width: 11px; height: 11px;
    margin-left: -6px; background: rgba(252, 253, 255, .97); transform: rotate(45deg);
    border-right: 1px solid rgba(104, 126, 186, .28); border-bottom: 1px solid rgba(104, 126, 186, .28);
    border-radius: 0 0 2px 0;
  }
  .top { display: flex; align-items: center; gap: 7px; margin-bottom: 5px; }
  .tag {
    font-size: 10px; font-weight: 700; letter-spacing: .5px; color: #fff;
    background: linear-gradient(135deg, #4d6bfe, #7aa2ff); padding: 2px 7px 2px 6px; border-radius: 6px;
  }
  .when { margin-left: auto; font-size: 10.5px; color: #8a93ad; }
  .headline { font-size: 13px; color: #343c58; }
  .headline b { font-size: 19px; font-weight: 700; color: #3d5bf0; letter-spacing: .2px; }
  .headline .of { font-size: 11.5px; color: #8a93ad; }
  .meter { height: 5px; margin: 7px 0 6px; border-radius: 3px; background: #e8ecf7; overflow: hidden; }
  .meter i { display: block; height: 100%; width: 0; border-radius: 3px; background: linear-gradient(90deg, #4d6bfe, #7fb4ff); transition: width .4s ease; }
  .meta { font-size: 10.5px; color: #7b849e; display: flex; flex-wrap: wrap; gap: 2px 8px; }
  .extra { font-size: 10.5px; color: #7b849e; margin-top: 2px; }
  .extra:empty { display: none; }
  .hint { font-size: 10.5px; color: #98a0b8; margin-top: 4px; }
  .err { color: #c2415d; font-size: 12px; }
  .pending { color: #5d6685; font-size: 12.5px; }
  .pending::after { content: "…"; }
</style>
</head>
<body>
<div id="stage">
  <svg id="backSvg" aria-hidden="true">
    <ellipse id="shadow" class="shadow" cx="0" cy="0" rx="0" ry="0"></ellipse>
  </svg>
  <div id="whaleLayer"></div>
  <svg id="frontSvg" aria-hidden="true">
    <g id="pet"></g>
    <g id="fx"></g>
  </svg>
  <div id="bubble" hidden>
    <div class="top"><span class="tag" id="tag">QODER</span><span class="when" id="when"></span></div>
    <div class="headline" id="headline"></div>
    <div class="meter" id="meter"><i id="fill"></i></div>
    <div class="meta" id="meta"></div>
    <div class="extra" id="extra"></div>
    <div class="hint" id="hint"></div>
  </div>
</div>
<script type="module">
import { createPet } from '../kit/body.js';
import { createWhaleFigure } from '../whale/figure.js';

const $ = id => document.getElementById(id);
const stage = $('stage'), bubble = $('bubble');
const qs = new URLSearchParams(location.search);
const clampNum = (v, lo, hi, d) => { const n = Number(v); return Number.isFinite(n) ? Math.max(lo, Math.min(hi, n)) : d; };

let scale = clampNum(qs.get('scale'), .5, 2.2, 1);
let scheme = qs.get('scheme') || 'deepseek';
let outfit = qs.get('outfit') || 'maid';
let active = true;
let hideTimer = 0;

const post = msg => { try { webkit.messageHandlers.coo.postMessage(msg); } catch (e) {} };
const fmt = n => Number(n || 0).toLocaleString('zh-CN', { maximumFractionDigits: 0 });

window.__cooErrs = [];
addEventListener('error', e => {
  window.__cooErrs.push(String(e.message) + ' @' + (e.filename || '') + ':' + e.lineno);
  post({ type: 'jsError', message: String(e.message) + ' @' + (e.filename || '') + ':' + e.lineno });
});
addEventListener('unhandledrejection', e => {
  window.__cooErrs.push(String(e.reason && (e.reason.stack || e.reason)));
  post({ type: 'jsError', message: String(e.reason && (e.reason.stack || e.reason)) });
});

let figure, ctl;
try {
  figure = await createWhaleFigure(undefined, { scheme: `${scheme}-${outfit}`, canvasHost: $('whaleLayer') });
  ctl = createPet(
    { petG: $('pet'), shadowEl: $('shadow'), fxG: $('fx') },
    {
      figure, sfx: {},
      roam: qs.get('roam') === '0' ? 'off' : 'free',
      enter: 'drop',
      ground: 'free',
      bounds: () => ({ W: innerWidth, H: innerHeight, floorY: innerHeight - 14, S: .55 * scale }),
    }
  );
} catch (e) {
  post({ type: 'jsError', message: 'figure init failed: ' + String(e && (e.stack || e)) });
  throw e;
}
new ResizeObserver(() => ctl.resize()).observe(stage);

const pt = e => { const r = stage.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
let press = null;
stage.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  const p = pt(e);
  if (!ctl.pointerDown(p)) return;
  try { stage.setPointerCapture(e.pointerId); } catch (err) {}
  press = { id: e.pointerId, x: e.clientX, y: e.clientY, t: performance.now(), moved: 0 };
});
stage.addEventListener('pointermove', e => {
  stage.style.cursor = ctl.pointerMove(pt(e)) || '';
  if (press && e.pointerId === press.id) {
    press.moved = Math.max(press.moved, Math.hypot(e.clientX - press.x, e.clientY - press.y));
  }
});
const endPress = e => {
  ctl.pointerUp();
  if (press && e.pointerId === press.id) {
    const tap = press.moved < 6 && performance.now() - press.t < 700;
    press = null;
    if (tap) post({ type: 'petClick' });
  }
};
stage.addEventListener('pointerup', endPress);
stage.addEventListener('pointercancel', endPress);
stage.addEventListener('pointerleave', () => { ctl.pointerLeave(); });
stage.addEventListener('contextmenu', e => {
  e.preventDefault();
  if (ctl.hitPet(pt(e))) post({ type: 'menu' });
});

function render(p) {
  $('tag').textContent = p.tag || 'QODER';
  $('when').textContent = p.when || '';
  $('headline').textContent = '';
  $('meta').textContent = '';
  $('extra').textContent = '';
  $('hint').textContent = '';
  if (p.pending) {
    const s = document.createElement('div'); s.className = 'pending'; s.textContent = p.message || '让我看看今天的用量';
    $('headline').append(s);
    $('meter').style.visibility = 'hidden';
    $('meter').style.display = 'block';
    return;
  }
  $('meter').style.visibility = 'visible';
  $('meter').style.display = 'block';
  if (!p.ok) {
    const s = document.createElement('div'); s.className = 'err'; s.textContent = p.error || '暂时查不到余额';
    $('headline').append(s);
    $('meter').style.display = 'none';
    $('hint').textContent = p.hint || '点菜单栏 → 重新读取登录凭证';
    return;
  }
  if (p.kind === 'money') {
    const sym = p.currency === 'USD' ? '$' : '¥';
    const b = document.createElement('b'); b.textContent = sym + Number(p.amount || 0).toFixed(2);
    const of = document.createElement('span'); of.className = 'of'; of.textContent = ' ' + (p.currency || 'CNY');
    $('headline').append('余额 ', b, of);
    $('meter').style.display = 'none';
    $('meta').textContent = (p.lines || []).join(' · ');
    $('extra').textContent = p.available === false ? '账户当前不可用' : '';
    return;
  }
  const b = document.createElement('b'); b.textContent = fmt(p.remaining);
  const of = document.createElement('span'); of.className = 'of'; of.textContent = ' / ' + fmt(p.total) + ' 积分';
  $('headline').append('还剩 ', b, of);
  const pct = p.total > 0 ? Math.max(0, Math.min(100, 100 * p.remaining / p.total)) : 0;
  $('fill').style.width = pct + '%';
  const meta = [];
  meta.push('已用 ' + fmt(p.used));
  if (p.reset) meta.push(p.reset);
  $('meta').textContent = meta.join(' · ');
  if (p.addOnRemaining > 0) $('extra').textContent = '附加积分 ' + fmt(p.addOnRemaining) + (p.addOnTotal > 0 ? ' / ' + fmt(p.addOnTotal) : '');
}

function showBubble(p, secs) {
  render(p);
  bubble.hidden = false;
  requestAnimationFrame(() => bubble.classList.add('show'));
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => window.coo.hideBubble(), (secs || 12) * 1000);
  ctl.holdRoam((secs || 12) * .7);
  if (p.ok && !p.pending) {
    ctl.act('wave');
    ctl.setExpr('happy', 2.2);
  } else if (p.pending) {
    ctl.act('look');
    ctl.setThinking(true);
  } else {
    ctl.setThinking(false);
    ctl.setExpr('sad', 2.4);
  }
  if (!p.pending) ctl.setThinking(false);
}

window.coo = {
  showBalance: (p, secs) => showBubble(p, secs),
  updateBalance: p => { if (!bubble.hidden) render(p); },
  hideBubble() {
    bubble.classList.remove('show');
    hideTimer = setTimeout(() => { bubble.hidden = true; }, 200);
  },
  setScheme(sc, of) {
    scheme = sc; outfit = of;
    figure.setScheme(`${sc}-${of}`, { fade: .35 }).then(() => {
      ctl.pet.sqv += 1.2;
      ctl.setExpr('happy', 1.4);
    }).catch(e => post({ type: 'jsError', message: 'setScheme: ' + String(e) }));
  },
  setScale(v) { scale = clampNum(v, .5, 2.2, 1); ctl.resize(); },
  setRoam(on) { ctl.setRoam(on ? 'free' : 'off'); if (!on) ctl.act('stand'); },
  poke() { ctl.act('hop'); },
  setActive(on) { active = !!on; },
  state() { return { scheme, outfit, scale, box: ctl.layout().box, mode: ctl.pet.mode, y: Math.round(ctl.pet.gy) }; },
};

function placeBubble() {
  if (bubble.hidden) return;
  const a = ctl.anchor();
  const bw = bubble.offsetWidth || 240, bh = bubble.offsetHeight || 96;
  const cx = Math.min(Math.max(a.x, bw / 2 + 8), innerWidth - bw / 2 - 8);
  bubble.style.left = cx + 'px';
  bubble.style.top = Math.max(a.y - 2, bh + 10) + 'px';
}

let lastReport = 0;
function report(now) {
  if (now - lastReport < 120) return;
  lastReport = now;
  const l = ctl.layout();
  post({ type: 'layout', box: l.box, pressing: !!ctl.pressing, mode: l.mode });
}

let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  // a full-screen transparent stage is costly to paint; halve the rate except while she is handled
  const quick = ctl.pressing || ctl.pet.mode === 'drag' || ctl.pet.mode === 'air';
  if (!quick && now - last < 1000 / 32) return;
  const dt = Math.min(.05, (now - last) / 1000);
  last = now;
  if (active && !document.hidden) {
    ctl.step(dt);
    ctl.render();
    placeBubble();
    report(now);
  }
}
requestAnimationFrame(frame);
post({ type: 'ready' });
</script>
</body>
</html>
